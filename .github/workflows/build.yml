name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build RSSG.sln --configuration Release
      - run: dotnet run --project tests/RSSG.Core.Tests/RSSG.Core.Tests.csproj --configuration Release